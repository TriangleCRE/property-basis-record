<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Basis Record — Triangle Investments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F1EEE3;
    --paper-line: #D9D3C0;
    --ink: #262F27;
    --ink-soft: #5B6259;
    --sage: #6E7A5C;
    --sage-deep: #4E5A40;
    --copper: #9C5A28;
    --copper-soft: #C88B54;
    --review: #A23B2A;
    --review-soft: #E9C9BE;
    --slate: #6D7A8C;
    --paper-card: #FAF8F1;
    --shadow: rgba(38,47,39,0.08);
    --edit-bg: #FFF7DC;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image:
      repeating-linear-gradient(to bottom, transparent, transparent 35px, rgba(217,211,192,0.35) 35px, rgba(217,211,192,0.35) 36px);
  }

  a{ color: inherit; }
  button{ font-family: inherit; }

  .wrap{
    max-width: 1220px;
    margin: 0 auto;
    padding: 40px 28px 80px;
  }

  /* ---------- Header ---------- */
  header.masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap: 24px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 22px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .masthead-title{
    display:flex;
    align-items:center;
    gap: 22px;
  }

  .logo-mark{
    flex-shrink:0;
    display:flex;
    align-items:center;
  }
  .logo-mark img{
    height: 76px;
    width:auto;
    display:block;
  }
  .title-divider{
    width:1px;
    align-self: stretch;
    background: var(--paper-line);
    flex-shrink:0;
  }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 34px;
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle{
    font-size: 13.5px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight:500;
  }

  .asof{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-align:right;
    line-height:1.6;
  }
  .asof b{ color: var(--ink); }

  /* ---------- Stat strip ---------- */
  .stats{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--ink);
    border: 1px solid var(--ink);
    margin-bottom: 30px;
  }
  .stat{
    background: var(--paper-card);
    padding: 16px 16px;
  }
  .stat .num{
    font-family:'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    color: var(--sage-deep);
    display:block;
  }
  .stat.flagged .num{ color: var(--review); }
  .stat.building .num{ color: var(--copper); }
  .stat .lbl{
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    font-weight:500;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    gap: 6px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--paper-line);
    flex-wrap: wrap;
  }
  .tab{
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 4px;
    margin-right: 22px;
    background:none; border:none;
    cursor:pointer;
    color: var(--ink-soft);
    border-bottom: 2.5px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  .tab:hover{ color: var(--ink); }
  .tab.active{
    color: var(--ink);
    border-bottom-color: var(--copper);
  }
  .tab .count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-left: 5px;
  }

  /* ---------- Period bar ---------- */
  .period-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .period-tabs{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
  }
  .period-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--sage-deep);
    background: var(--paper-card);
    border-radius: 3px;
    cursor:pointer;
    color: var(--sage-deep);
  }
  .period-pill.active{
    background: var(--sage-deep);
    color: #fff;
  }
  .period-pill .pcount{ opacity:0.7; margin-left:5px; }

  .period-actions{
    display:flex;
    gap: 8px;
    flex-wrap:wrap;
  }
  .ghost-btn{
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px;
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 3px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .ghost-btn:hover{ border-color: var(--sage-deep); color: var(--ink); }
  .ghost-btn.warn{ border-color: var(--review); color: var(--review); }
  .ghost-btn.warn:hover{ background: var(--review-soft); }

  .add-period-panel{
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display:flex;
    gap: 10px;
    align-items:center;
    flex-wrap:wrap;
  }
  .add-period-panel input[type="text"]{
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background:#fff;
  }
  .add-period-panel input[type="file"]{
    font-size: 12.5px;
    max-width: 220px;
  }
  .csv-hint{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-style: italic;
    width: 100%;
  }
  .panel-error{
    font-size: 12.5px;
    color: var(--review);
    width: 100%;
  }

  /* ---------- Controls ---------- */
  .controls{
    display:flex;
    gap: 12px;
    align-items:center;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .search{
    flex: 1 1 260px;
    position:relative;
  }
  .search input{
    width:100%;
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 9px 12px 9px 32px;
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 3px;
    color: var(--ink);
    outline:none;
  }
  .search input:focus{
    border-color: var(--sage-deep);
  }
  .search::before{
    content: "⌕";
    position:absolute;
    left: 11px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    font-size: 15px;
  }

  .filterset{
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip{
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 13px;
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 20px;
    cursor:pointer;
    color: var(--ink-soft);
    white-space:nowrap;
    transition: all .12s ease;
  }
  .chip:hover{ border-color: var(--sage-deep); color: var(--ink); }
  .chip.active{
    background: var(--sage-deep);
    border-color: var(--sage-deep);
    color: #fff;
  }

  .sort-hint{
    font-size: 11.5px;
    color: var(--ink-soft);
    font-style: italic;
  }

  /* ---------- Table ---------- */
  .tablewrap{
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 3px var(--shadow);
  }

  table{
    width:100%;
    border-collapse: collapse;
  }

  thead th{
    position: sticky; top:0;
    background: var(--ink);
    color: #F1EEE3;
    text-align:left;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight:500;
    padding: 11px 14px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th.num-col, td.num-col{ text-align:right; }
  thead th .arrow{ opacity:0.5; font-size:10px; margin-left:3px; }
  thead th.sorted .arrow{ opacity:1; }

  tbody tr{
    border-bottom: 1px solid var(--paper-line);
    cursor:pointer;
    transition: background .1s ease;
  }
  tbody tr:hover{ background: rgba(110,122,92,0.07); }
  tbody tr.flagged{ background: rgba(162,59,42,0.045); }
  tbody tr.flagged:hover{ background: rgba(162,59,42,0.09); }

  td{
    padding: 11px 14px;
    font-size: 13.5px;
    vertical-align: top;
  }
  td.name-cell{
    font-weight: 500;
    display:flex;
    align-items:center;
    gap:9px;
  }
  td.name-cell[title]{
    cursor: default;
  }
  .name-text.has-address{
    text-decoration: underline dotted;
    text-decoration-color: var(--paper-line);
    text-underline-offset: 3px;
  }
  td.num-col{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    white-space:nowrap;
  }
  td.basis-col{
    font-weight:600;
    color: var(--sage-deep);
  }
  .dash{ color: var(--ink-soft); opacity:0.55; }

  .mark{
    font-family:'Caveat', cursive;
    font-size: 20px;
    line-height:1;
    display:inline-block;
    width:16px;
    text-align:center;
    flex-shrink:0;
  }
  .mark.ok{ color: var(--sage); }
  .mark.land{ color: var(--copper); }
  .mark.building{ color: var(--slate); }
  .mark.review{ color: var(--review); }

  /* editable cells */
  td.editable{ cursor: text; position:relative; }
  td.editable .cell-display{
    border-bottom: 1px dotted transparent;
  }
  td.editable:hover .cell-display{
    border-bottom-color: var(--sage-deep);
  }
  td.editable.is-editing{ padding: 6px 8px; }
  .cell-input{
    width: 100%;
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--sage-deep);
    background: var(--edit-bg);
    border-radius: 2px;
    outline:none;
  }
  .edited-dot{
    color: var(--copper);
    font-weight:700;
    margin-left: 3px;
    cursor:help;
  }

  tr.expand-row{ cursor:default; }
  tr.expand-row:hover{ background: none; }
  tr.expand-row td{
    padding: 0 14px 16px 14px;
    background: rgba(110,122,92,0.045);
  }
  .expand-inner{
    display:none;
    padding: 14px 4px 4px;
    border-top: 1px dashed var(--paper-line);
  }
  .expand-inner.open{ display:block; }

  .address-line{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .address-line::before{
    content: "⌖";
    color: var(--copper);
    font-size: 12px;
  }

  .equation{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    line-height:1.8;
  }
  .equation b{ color: var(--ink); }

  .notebox{
    font-size: 13px;
    color: var(--review);
    background: var(--review-soft);
    border-left: 3px solid var(--review);
    padding: 8px 12px;
    border-radius: 2px;
    max-width: 640px;
    margin-bottom: 6px;
  }
  .notebox.neutral{
    color: var(--copper);
    background: rgba(200,139,84,0.15);
    border-left-color: var(--copper);
  }
  .edit-hint{
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  /* ---------- Simple list panels (Not Relevant / Not Included) ---------- */
  .info-banner{
    font-size: 13.5px;
    color: var(--ink-soft);
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-left: 3px solid var(--sage-deep);
    padding: 12px 16px;
    border-radius: 3px;
    margin-bottom: 16px;
  }

  .simplelist{
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 4px;
    overflow:hidden;
  }
  .simplelist .row{
    padding: 12px 16px;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13.5px;
    display:flex;
    justify-content:space-between;
    gap: 16px;
    align-items:baseline;
  }
  .simplelist .row:last-child{ border-bottom:none; }
  .simplelist .row .row-main{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap: 16px;
    flex: 1;
    min-width: 0;
  }
  .row-delete{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 16px;
    line-height:1;
    cursor:pointer;
    padding: 2px 4px;
    flex-shrink:0;
  }
  .row-delete:hover{ color: var(--review); }
  .simplelist .row .extra{
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
    text-align:right;
    max-width: 55%;
  }

  /* ---------- Compare panel ---------- */
  .compare-controls{
    display:flex;
    gap: 14px;
    align-items:center;
    margin-bottom: 16px;
    flex-wrap:wrap;
  }
  .compare-controls select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--paper-line);
    background: var(--paper-card);
    border-radius: 3px;
  }
  .compare-vs{
    font-family:'Fraunces', serif;
    font-style: italic;
    color: var(--ink-soft);
  }
  td.delta-pos{ color: var(--sage-deep); }
  td.delta-neg{ color: var(--review); }
  .status-tag{
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    margin-left: 6px;
  }

  /* ---------- Legend ---------- */
  .legend{
    display:flex;
    gap: 22px;
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px dashed var(--paper-line);
    flex-wrap:wrap;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .legend .item{ display:flex; align-items:center; gap:7px; }

  .empty{
    padding: 40px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  footer{
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--paper-line);
    font-size: 12px;
    color: var(--ink-soft);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }

  @media (max-width: 900px){
    .stats{ grid-template-columns: repeat(3,1fr); }
  }
  @media (max-width: 720px){
    .asof{ text-align:left; }
    header.masthead{ align-items:flex-start; }
    td, thead th{ padding: 9px 8px; font-size:12.5px; }
    .simplelist .row{ flex-direction:column; }
    .simplelist .row .extra{ max-width:100%; text-align:left; }
  }
  @media (max-width: 480px){
    .stats{ grid-template-columns: repeat(2,1fr); }
    .stat:last-child{ grid-column: span 2; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  :focus-visible{
    outline: 2px solid var(--sage-deep);
    outline-offset: 2px;
  }
</style>
</head>

<script>
(function(){

  // ---------- Utility functions ----------
  const fmt = (n) => {
    if (n === null || n === undefined || isNaN(n)) return null;
    const neg = n < 0;
    const r = Math.round(Math.abs(n));
    const s = '$' + r.toLocaleString('en-US');
    return neg ? '(' + s + ')' : s;
  };

  const fmtPct = (n) => {
    if (n === null || n === undefined || isNaN(n)) return null;
    const neg = n < 0;
    const s = Math.abs(n).toFixed(1) + '%';
    return neg ? '−' + s : '+' + s;
  };

  function parseNumber(str){
    if (str === undefined || str === null) return null;
    let s = String(str).trim();
    if (s === '' || s === '-' || s.toLowerCase() === 'n/a') return null;
    let neg = false;
    if (s.startsWith('(') && s.endsWith(')')){ neg = true; s = s.slice(1, -1); }
    s = s.replace(/[$,\s]/g, '');
    if (s.startsWith('-')){ neg = true; s = s.slice(1); }
    if (s === '') return null;
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return neg ? -n : n;
  }

  function parseCSV(text){
    const rows = [];
    let field = '', row = [], inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ row.push(field); field = ''; }
        else if (c === '\n' || c === '\r'){
          if (c === '\r' && text[i+1] === '\n') i++;
          row.push(field); field = '';
          if (row.length > 1 || row[0] !== '') rows.push(row);
          row = [];
        } else field += c;
      }
    }
    if (field !== '' || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function computeBasis(land, building, accdep){
    return (land || 0) + (building || 0) - (accdep || 0);
  }

  function generateNotes(name, land, building, accdep){
    const notes = [];
    const hasLand = land !== null && land !== undefined;
    const hasBuilding = building !== null && building !== undefined;
    const hasAccdep = accdep !== null && accdep !== undefined;
    if (!hasLand) notes.push('No Land account');
    if (!hasBuilding) notes.push('No Building account (Land-only property)');
    if (hasBuilding && !hasAccdep) notes.push('No Accumulated Depreciation account');
    if (hasBuilding && hasAccdep && Math.abs(accdep) >= Math.abs(building) * 0.99 && building !== 0) {
      notes.push('Nearly/fully depreciated (AccumDep ~ Building)');
    }
    if (/^lot/i.test((name||'').trim()) && hasBuilding) {
      notes.push('Sheet titled "Lot" but has a Building balance - verify');
    }
    if (!hasBuilding && hasAccdep) {
      notes.push('Has Accumulated Depreciation but no Building on record - verify');
    }
    return notes.join('; ');
  }

  function classify(land, building, notes){
    const hasLand = land !== null && land !== undefined;
    const hasBuilding = building !== null && building !== undefined;
    const n = (notes || '').toLowerCase();
    const anomaly = n.includes('verify') || n.includes('nearly') || n.includes('no accumulated depreciation');
    if (anomaly) return { type: 'review', label: 'Flagged for review' };
    if (hasLand && !hasBuilding) return { type: 'land', label: 'Land only' };
    if (hasBuilding && !hasLand) return { type: 'building', label: 'Building only' };
    return { type: 'ok', label: 'Complete' };
  }

  function recompute(item){
    item.basis = computeBasis(item.land, item.building, item.accdep);
    item.notes = generateNotes(item.name, item.land, item.building, item.accdep);
  }

  function deepCopy(x){ return JSON.parse(JSON.stringify(x)); }

  // ---------- API helpers ----------
  // Everything here talks to the /api/properties serverless functions, which
  // read/write the Postgres database. The table is created and seeded on the
  // server side the first time it's used (see lib/ensureSeeded.js) — nothing
  // to run by hand.
  async function apiFetch(path, options){
    const res = await fetch(path, options);
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok){
      throw new Error((body && body.error) || ('Request failed (' + res.status + ')'));
    }
    return body;
  }
  const api = {
    list: () => apiFetch('/api/properties'),
    create: (payload) => apiFetch('/api/properties', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
    }),
    update: (id, fields) => apiFetch('/api/properties/' + id, {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(fields)
    }),
    remove: (id) => apiFetch('/api/properties/' + id, { method: 'DELETE' }),
  };

  // ---------- Period data model ----------
  // The "May 2026" period is the live, database-backed set of records.
  // Any additional periods loaded via CSV (see "+ Add period") are session-only
  // comparison snapshots, same as before — they are never sent to the server.
  const LIVE_PERIOD = 'May 2026';
  let periods = {};
  let periodOrder = [];

  function makePeriod(label, rawArray, opts){
    const persisted = !!(opts && opts.persisted);
    const basis = rawArray.map((p, i) => {
      const item = { _id: persisted ? String(p.id) : (label + '__' + i), name: p.name, land: p.land, building: p.building, accdep: p.accdep, address: p.address || null, basis: 0, notes: '' };
      recompute(item);
      return item;
    });
    periods[label] = {
      basis: basis,
      original: deepCopy(basis),
      originalMap: null,
      persisted: persisted,
    };
    periods[label].originalMap = new Map(periods[label].original.map(x => [x._id, x]));
    periodOrder.push(label);
  }

  let currentPeriod = LIVE_PERIOD;
  let notRelevant = [];
  let notIncluded = [];
  let addressByName = {};

  function currentBasis(){ return periods[currentPeriod].basis; }
  function findItem(id){ return currentBasis().find(x => x._id === id); }
  function hasEditsInCurrent(){
    const orig = periods[currentPeriod].originalMap;
    return currentBasis().some(item => {
      const o = orig.get(item._id);
      return o && (o.land !== item.land || o.building !== item.building || o.accdep !== item.accdep);
    });
  }
  function isEdited(id, field){
    const item = findItem(id);
    const o = periods[currentPeriod].originalMap.get(id);
    if (!item || !o) return false;
    return o[field] !== item[field];
  }

  // ---------- Tabs ----------
  let activeTab = 'basis';
  const tabbar = document.getElementById('tabbar');

  function tabDefs(){
    return [
      { id:'basis', label:'Basis Calculation', count: currentBasis().length },
      { id:'notrelevant', label:'Not Relevant', count: notRelevant.length },
      { id:'notincluded', label:'Not Included', count: notIncluded.length },
      { id:'compare', label:'Compare Periods', count: periodOrder.length },
    ];
  }

  function renderTabs(){
    const tabs = tabDefs();
    tabbar.innerHTML = tabs.map(t => `
      <button class="tab ${t.id===activeTab?'active':''}" data-tab="${t.id}">
        ${t.label}<span class="count">${t.count}</span>
      </button>
    `).join('');
    tabbar.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeTab = btn.dataset.tab;
        searchTerm=''; expandedRow=null; sortCol=null; activeFilter='all';
        renderTabs();
        renderPanel();
      });
    });
  }

  // ---------- Basis panel state ----------
  let searchTerm = '';
  let activeFilter = 'all';
  let sortCol = null;
  let sortDir = 1;
  let expandedRow = null;
  let addPeriodOpen = false;
  let addPropertyOpen = false;
  let addNotRelevantOpen = false;
  let addNotIncludedOpen = false;

  const filters = [
    { id:'all', label:'All properties' },
    { id:'land', label:'Land only' },
    { id:'building', label:'Building only' },
    { id:'review', label:'Flagged for review' },
  ];

  function enrichedBasis(){
    return currentBasis().map(p => {
      const c = classify(p.land, p.building, p.notes);
      return Object.assign({}, p, { _markType: c.type, _markLabel: c.label });
    });
  }

  function filteredBasis(){
    let rows = enrichedBasis();
    if (activeFilter !== 'all') rows = rows.filter(p => p._markType === activeFilter);
    if (searchTerm.trim()){
      const q = searchTerm.trim().toLowerCase();
      rows = rows.filter(p => p.name.toLowerCase().includes(q) || (p.notes||'').toLowerCase().includes(q));
    }
    if (sortCol){
      rows = rows.slice().sort((a,b)=>{
        let av = a[sortCol], bv = b[sortCol];
        if (sortCol === 'name'){
          return sortDir * av.localeCompare(bv);
        }
        av = (typeof av === 'number') ? av : -Infinity;
        bv = (typeof bv === 'number') ? bv : -Infinity;
        return sortDir * (av - bv);
      });
    }
    return rows;
  }

  function markHTML(type){
    if (type === 'ok') return `<span class="mark ok" title="Ties to Yardi trial balance">✓</span>`;
    if (type === 'land') return `<span class="mark land" title="Land-only property">◇</span>`;
    if (type === 'building') return `<span class="mark building" title="Building-only property">B</span>`;
    return `<span class="mark review" title="Flagged for review">✕</span>`;
  }

  function editableCellHTML(item, field, value){
    const edited = isEdited(item._id, field);
    const display = value != null ? fmt(field==='accdep' ? value : value) : '<span class="dash">—</span>';
    const wrapped = field==='accdep' && value != null ? '(' + fmt(value) + ')' : display;
    return `<td class="num-col editable" data-id="${item._id}" data-field="${field}">
      <span class="cell-display">${wrapped}${edited?`<span class="edited-dot" title="Edited — original: ${periods[currentPeriod].originalMap.get(item._id)[field]!=null?fmt(periods[currentPeriod].originalMap.get(item._id)[field]):'—'}">●</span>`:''}</span>
    </td>`;
  }

  function renderBasisPanel(container){
    renderStats();
    const hasEdits = hasEditsInCurrent();
    container.innerHTML = `
      <div class="period-bar">
        <div class="period-tabs" id="periodTabs">
          ${periodOrder.map(label => `<button class="period-pill ${label===currentPeriod?'active':''}" data-period="${label}">${label}<span class="pcount">${periods[label].basis.length}</span></button>`).join('')}
        </div>
        <div class="period-actions">
          ${periods[currentPeriod].persisted ? `<button class="ghost-btn" id="addPropertyBtn">+ Add property</button>` : ''}
          <button class="ghost-btn" id="addPeriodBtn">+ Add period</button>
          <button class="ghost-btn" id="exportSnapshotBtn">Export snapshot</button>
          <button class="ghost-btn" id="importSnapshotBtn">Import snapshot</button>
          <input type="file" id="importSnapshotFile" accept="application/json" style="display:none">
          ${hasEdits ? `<button class="ghost-btn warn" id="resetEditsBtn">Reset edits (${currentPeriod})</button>` : ''}
        </div>
      </div>
      ${periods[currentPeriod].persisted ? `
      <div class="add-period-panel" id="addPropertyPanel" style="display:${addPropertyOpen?'flex':'none'}">
        <input type="text" id="propNameInput" placeholder="Property name">
        <input type="text" inputmode="decimal" id="propLandInput" placeholder="Land">
        <input type="text" inputmode="decimal" id="propBuildingInput" placeholder="Building">
        <input type="text" inputmode="decimal" id="propAccdepInput" placeholder="Accum. Dep.">
        <button class="ghost-btn" id="saveNewPropertyBtn">Add</button>
        <button class="ghost-btn" id="cancelNewPropertyBtn">Cancel</button>
        <div class="panel-error" id="addPropertyError"></div>
      </div>
      ` : ''}
      <div class="add-period-panel" id="addPeriodPanel" style="display:${addPeriodOpen?'flex':'none'}">
        <input type="text" id="periodLabelInput" placeholder="Period label (e.g., June 2026 or Q3 2026)">
        <input type="file" id="periodFileInput" accept=".csv">
        <button class="ghost-btn" id="loadPeriodBtn">Load period</button>
        <button class="ghost-btn" id="cancelPeriodBtn">Cancel</button>
        <div class="csv-hint">CSV needs a header row with columns for Property Name, Land, Building, and Accumulated Depreciation (any order, close variants of these names are fine).</div>
        <div class="panel-error" id="addPeriodError"></div>
      </div>
      <div class="controls">
        <div class="search">
          <input type="text" id="searchInput" placeholder="Search properties or notes…" value="${searchTerm.replace(/"/g,'&quot;')}">
        </div>
        <div class="filterset" id="filterset">
          ${filters.map(f=>`<button class="chip ${activeFilter===f.id?'active':''}" data-filter="${f.id}">${f.label}</button>`).join('')}
        </div>
        <div class="sort-hint">Click a column to sort · Click a value to edit it</div>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th data-col="name" class="${sortCol==='name'?'sorted':''}">Property${arrowFor('name')}</th>
              <th data-col="land" class="num-col ${sortCol==='land'?'sorted':''}">Land${arrowFor('land')}</th>
              <th data-col="building" class="num-col ${sortCol==='building'?'sorted':''}">Building${arrowFor('building')}</th>
              <th data-col="accdep" class="num-col ${sortCol==='accdep'?'sorted':''}">Accum. Dep.${arrowFor('accdep')}</th>
              <th data-col="basis" class="num-col ${sortCol==='basis'?'sorted':''}">Basis${arrowFor('basis')}</th>
            </tr>
          </thead>
          <tbody id="basisBody"></tbody>
        </table>
      </div>
      <div class="legend">
        <div class="item"><span class="mark ok">✓</span> Complete — land and building both present</div>
        <div class="item"><span class="mark land">◇</span> Land only — no building on this parcel</div>
        <div class="item"><span class="mark building">B</span> Building only — no land on record</div>
        <div class="item"><span class="mark review">✕</span> Flagged — worth a second look</div>
        <div class="item"><span class="edited-dot" style="position:static">●</span> Edited from originally loaded value</div>
      </div>
    `;

    function arrowFor(col){
      if (sortCol !== col) return '';
      return `<span class="arrow">${sortDir===1?'▲':'▼'}</span>`;
    }

    const rows = filteredBasis();
    const tbody = document.getElementById('basisBody');
    if (rows.length === 0){
      tbody.innerHTML = `<tr><td colspan="5" class="empty">No properties match this search or filter.</td></tr>`;
    } else {
      tbody.innerHTML = rows.map((p) => {
        const key = p._id;
        const isOpen = expandedRow === key;
        const address = p.address || addressByName[p.name];
        return `
        <tr class="${p._markType==='review'?'flagged':''}" data-key="${key}">
          <td class="name-cell"${address?` title="${address.replace(/"/g,'&quot;')}"`:''}>${markHTML(p._markType)}<span class="name-text${address?' has-address':''}">${p.name}</span></td>
          ${editableCellHTML(p, 'land', p.land)}
          ${editableCellHTML(p, 'building', p.building)}
          ${editableCellHTML(p, 'accdep', p.accdep)}
          <td class="num-col basis-col">${fmt(p.basis)}</td>
        </tr>
        <tr class="expand-row" data-key-expand="${key}">
          <td colspan="5">
            <div class="expand-inner ${isOpen?'open':''}">
              ${address ? `<div class="address-line">${address}</div>` : ''}
              <div class="equation">
                <b>${p.land!=null?fmt(p.land):'$0'}</b> (Land)
                &nbsp;+&nbsp; <b>${p.building!=null?fmt(p.building):'$0'}</b> (Building)
                &nbsp;−&nbsp; <b>${p.accdep!=null?fmt(p.accdep):'$0'}</b> (Accum. Dep.)
                &nbsp;=&nbsp; <b>${fmt(p.basis)}</b> (Basis)
              </div>
              ${p.notes ? `<div class="notebox ${p._markType==='land'||p._markType==='building'?'neutral':''}">${p.notes}</div>` : ''}
              <div class="edit-hint">Click any Land, Building, or Accum. Dep. value above to edit it — Basis recalculates automatically.</div>
              ${periods[currentPeriod].persisted ? `<button class="ghost-btn warn delete-property-btn" data-delete-id="${p._id}" style="margin-top:10px">Delete this property</button>` : ''}
            </div>
          </td>
        </tr>
        `;
      }).join('');
    }

    wireBasisEvents(container);
  }

  function wireBasisEvents(container){
    document.getElementById('searchInput').addEventListener('input', (e)=>{
      searchTerm = e.target.value;
      renderBasisPanel(container);
      const inp = document.getElementById('searchInput');
      inp.focus();
      inp.setSelectionRange(searchTerm.length, searchTerm.length);
    });

    document.querySelectorAll('#filterset .chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        activeFilter = chip.dataset.filter;
        renderBasisPanel(container);
      });
    });

    document.querySelectorAll('thead th[data-col]').forEach(th=>{
      th.addEventListener('click', ()=>{
        const col = th.dataset.col;
        if (sortCol === col){ sortDir *= -1; } else { sortCol = col; sortDir = 1; }
        renderBasisPanel(container);
      });
    });

    // Period pills
    document.querySelectorAll('.period-pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        currentPeriod = pill.dataset.period;
        expandedRow = null;
        renderTabs();
        renderBasisPanel(container);
      });
    });

    // Add period toggle
    document.getElementById('addPeriodBtn').addEventListener('click', ()=>{
      addPeriodOpen = !addPeriodOpen;
      renderBasisPanel(container);
    });
    const cancelBtn = document.getElementById('cancelPeriodBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', ()=>{
      addPeriodOpen = false;
      renderBasisPanel(container);
    });
    const loadBtn = document.getElementById('loadPeriodBtn');
    if (loadBtn) loadBtn.addEventListener('click', ()=> handleLoadPeriod(container));

    // Add property (only offered on the live, database-backed period)
    const addPropertyBtn = document.getElementById('addPropertyBtn');
    if (addPropertyBtn) addPropertyBtn.addEventListener('click', ()=>{
      addPropertyOpen = !addPropertyOpen;
      renderBasisPanel(container);
    });
    const cancelPropertyBtn = document.getElementById('cancelNewPropertyBtn');
    if (cancelPropertyBtn) cancelPropertyBtn.addEventListener('click', ()=>{
      addPropertyOpen = false;
      renderBasisPanel(container);
    });
    const savePropertyBtn = document.getElementById('saveNewPropertyBtn');
    if (savePropertyBtn) savePropertyBtn.addEventListener('click', ()=> handleAddProperty(container));

    // Reset edits — reverts every edited value back to what was originally
    // loaded, both on screen and (for the live period) in the database.
    const resetBtn = document.getElementById('resetEditsBtn');
    if (resetBtn) resetBtn.addEventListener('click', async ()=>{
      const per = periods[currentPeriod];
      if (!per.persisted){
        per.basis = deepCopy(per.original);
        renderBasisPanel(container);
        return;
      }
      const edited = per.basis.filter(item => {
        const o = per.originalMap.get(item._id);
        return o && (o.land !== item.land || o.building !== item.building || o.accdep !== item.accdep);
      });
      resetBtn.disabled = true;
      resetBtn.textContent = 'Reverting…';
      try {
        for (const item of edited){
          const o = per.originalMap.get(item._id);
          await api.update(item._id, { land: o.land, building: o.building, accdep: o.accdep });
        }
        per.basis = deepCopy(per.original);
        renderBasisPanel(container);
      } catch (err){
        alert('Could not reset all edits: ' + err.message);
        renderBasisPanel(container);
      }
    });

    // Export / import snapshot
    document.getElementById('exportSnapshotBtn').addEventListener('click', exportSnapshot);
    document.getElementById('importSnapshotBtn').addEventListener('click', ()=>{
      document.getElementById('importSnapshotFile').click();
    });
    document.getElementById('importSnapshotFile').addEventListener('change', (e)=> handleImportSnapshot(e, container));

    // Row expand + inline editing + delete (event delegation)
    const tbody = document.getElementById('basisBody');
    tbody.addEventListener('click', (e)=>{
      const delBtn = e.target.closest('.delete-property-btn');
      if (delBtn){
        e.stopPropagation();
        handleDeleteProperty(delBtn.dataset.deleteId, container);
        return;
      }
      const cell = e.target.closest('td.editable');
      if (cell){
        e.stopPropagation();
        if (cell.classList.contains('is-editing')) return;
        startEdit(cell, container);
        return;
      }
      const tr = e.target.closest('tr[data-key]');
      if (tr){
        const key = tr.dataset.key;
        expandedRow = (expandedRow === key) ? null : key;
        renderBasisPanel(container);
      }
    });
  }

  async function handleAddProperty(container){
    const errorBox = document.getElementById('addPropertyError');
    errorBox.textContent = '';
    const name = document.getElementById('propNameInput').value.trim();
    if (!name){ errorBox.textContent = 'Enter a property name.'; return; }
    const land = parseNumber(document.getElementById('propLandInput').value);
    const building = parseNumber(document.getElementById('propBuildingInput').value);
    let accdep = parseNumber(document.getElementById('propAccdepInput').value);
    if (accdep !== null) accdep = Math.abs(accdep);
    const saveBtn = document.getElementById('saveNewPropertyBtn');
    saveBtn.disabled = true;
    try {
      const created = await api.create({ category: 'basis', name, land, building, accdep });
      const per = periods[currentPeriod];
      const item = { _id: String(created.id), name: created.name, land: created.land, building: created.building, accdep: created.accdep, address: created.address || null, basis: 0, notes: '' };
      recompute(item);
      per.basis.push(item);
      const orig = deepCopy(item);
      per.original.push(orig);
      per.originalMap.set(item._id, orig);
      addPropertyOpen = false;
      renderBasisPanel(container);
    } catch (err){
      errorBox.textContent = 'Could not add property: ' + err.message;
      saveBtn.disabled = false;
    }
  }

  async function handleDeleteProperty(id, container){
    const item = findItem(id);
    if (!item) return;
    if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
    try {
      await api.remove(id);
      const per = periods[currentPeriod];
      per.basis = per.basis.filter(x => x._id !== id);
      per.original = per.original.filter(x => x._id !== id);
      per.originalMap.delete(id);
      if (expandedRow === id) expandedRow = null;
      renderBasisPanel(container);
    } catch (err){
      alert('Could not delete property: ' + err.message);
    }
  }

  function startEdit(cell, container){
    const id = cell.dataset.id, field = cell.dataset.field;
    const item = findItem(id);
    const raw = item[field];
    cell.classList.add('is-editing');
    cell.innerHTML = `<input type="text" inputmode="decimal" class="cell-input" value="${raw!=null?raw:''}">`;
    const input = cell.querySelector('input');
    input.focus();
    input.select();
    input.addEventListener('click', ev => ev.stopPropagation());
    let committed = false;
    function commit(){
      if (committed) return;
      committed = true;
      let val = parseNumber(input.value);
      if (field === 'accdep' && val !== null) val = Math.abs(val);
      const prevVal = item[field];
      item[field] = val;
      recompute(item);
      renderBasisPanel(container);
      if (val === prevVal) return;
      if (periods[currentPeriod].persisted){
        api.update(item._id, { [field]: val }).catch(err => {
          alert('Could not save change: ' + err.message + ' — reverting.');
          item[field] = prevVal;
          recompute(item);
          renderBasisPanel(container);
        });
      }
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (ev)=>{
      if (ev.key === 'Enter'){ input.blur(); }
      if (ev.key === 'Escape'){ committed = true; renderBasisPanel(container); }
    });
  }

  function handleLoadPeriod(container){
    const errorBox = document.getElementById('addPeriodError');
    errorBox.textContent = '';
    const label = document.getElementById('periodLabelInput').value.trim();
    const fileInput = document.getElementById('periodFileInput');
    if (!label){ errorBox.textContent = 'Enter a period label first.'; return; }
    if (periods[label]){ errorBox.textContent = `"${label}" already exists — choose a different label.`; return; }
    if (!fileInput.files || !fileInput.files[0]){ errorBox.textContent = 'Choose a CSV file to load.'; return; }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const rows = parseCSV(e.target.result);
        if (rows.length < 2) throw new Error('The file appears to be empty.');
        const header = rows[0].map(h => h.trim().toLowerCase());
        const findCol = (keywords) => header.findIndex(h => keywords.some(k => h.includes(k)));
        const nameIdx = findCol(['property', 'name']);
        const landIdx = findCol(['land']);
        const buildingIdx = findCol(['building']);
        const accdepIdx = findCol(['depreciation', 'accum']);
        if (nameIdx === -1) throw new Error('Could not find a Property Name column.');
        if (landIdx === -1 && buildingIdx === -1) throw new Error('Could not find Land or Building columns.');
        const rawArray = rows.slice(1).filter(r => r.some(c => c.trim() !== '')).map(r => ({
          name: (r[nameIdx] || '').trim(),
          land: landIdx > -1 ? parseNumber(r[landIdx]) : null,
          building: buildingIdx > -1 ? parseNumber(r[buildingIdx]) : null,
          accdep: accdepIdx > -1 ? (parseNumber(r[accdepIdx]) !== null ? Math.abs(parseNumber(r[accdepIdx])) : null) : null,
        })).filter(p => p.name);
        if (rawArray.length === 0) throw new Error('No property rows found in the file.');
        makePeriod(label, rawArray);
        currentPeriod = label;
        addPeriodOpen = false;
        renderTabs();
        renderBasisPanel(container);
      } catch (err){
        errorBox.textContent = 'Could not load file: ' + err.message;
      }
    };
    reader.onerror = () => { errorBox.textContent = 'Could not read the file.'; };
    reader.readAsText(file);
  }

  function exportSnapshot(){
    const payload = { periodOrder, periods: {} };
    periodOrder.forEach(label => {
      payload.periods[label] = { basis: periods[label].basis.map(({_id, ...rest}) => rest) };
    });
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'property_basis_snapshot.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function handleImportSnapshot(e, container){
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const payload = JSON.parse(ev.target.result);
        if (!payload.periods || !payload.periodOrder) throw new Error('Not a recognized snapshot file.');
        periods = {};
        periodOrder = [];
        payload.periodOrder.forEach(label => {
          const rawArray = payload.periods[label].basis.map(p => ({ name: p.name, land: p.land, building: p.building, accdep: p.accdep }));
          makePeriod(label, rawArray);
        });
        currentPeriod = periodOrder[0];
        renderTabs();
        renderPanel();
      } catch (err){
        alert('Could not import snapshot: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ---------- Not Relevant / Not Included ----------
  function renderNotRelevantPanel(container){
    container.innerHTML = `
      <div class="info-banner">These properties have no Land, Building, or Accumulated Depreciation account in their Yardi trial balance, so they're excluded from the basis calculation.</div>
      <div class="period-actions" style="margin-bottom:12px">
        <button class="ghost-btn" id="addNotRelevantBtn">+ Add</button>
      </div>
      <div class="add-period-panel" id="addNotRelevantPanel" style="display:${addNotRelevantOpen?'flex':'none'}">
        <input type="text" id="nrNameInput" placeholder="Property name">
        <input type="text" id="nrExtraInput" placeholder="Note (optional)">
        <button class="ghost-btn" id="saveNotRelevantBtn">Add</button>
        <button class="ghost-btn" id="cancelNotRelevantBtn">Cancel</button>
        <div class="panel-error" id="addNotRelevantError"></div>
      </div>
      <div class="simplelist" id="nrList"></div>
    `;
    const list = document.getElementById('nrList');
    const q = searchTerm.trim().toLowerCase();
    const rows = notRelevant.filter(p => !q || p.name.toLowerCase().includes(q) || (p.extra||'').toLowerCase().includes(q));
    list.innerHTML = rows.length ? rows.map(p => `
      <div class="row">
        <div class="row-main">
          <span>${p.name}</span>
          ${p.extra ? `<span class="extra">${p.extra}</span>` : ''}
        </div>
        <button class="row-delete" data-id="${p._id}" title="Delete">×</button>
      </div>
    `).join('') : `<div class="empty">No matches.</div>`;

    document.getElementById('addNotRelevantBtn').addEventListener('click', ()=>{
      addNotRelevantOpen = !addNotRelevantOpen;
      renderNotRelevantPanel(container);
    });
    const cancelBtn = document.getElementById('cancelNotRelevantBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', ()=>{
      addNotRelevantOpen = false;
      renderNotRelevantPanel(container);
    });
    const saveBtn = document.getElementById('saveNotRelevantBtn');
    if (saveBtn) saveBtn.addEventListener('click', async ()=>{
      const errorBox = document.getElementById('addNotRelevantError');
      errorBox.textContent = '';
      const name = document.getElementById('nrNameInput').value.trim();
      if (!name){ errorBox.textContent = 'Enter a property name.'; return; }
      const extra = document.getElementById('nrExtraInput').value.trim();
      saveBtn.disabled = true;
      try {
        const created = await api.create({ category: 'not_relevant', name, extra: extra || null });
        notRelevant.push({ _id: String(created.id), name: created.name, extra: created.extra || '' });
        addNotRelevantOpen = false;
        renderTabs();
        renderNotRelevantPanel(container);
      } catch (err){
        errorBox.textContent = 'Could not add: ' + err.message;
        saveBtn.disabled = false;
      }
    });
    list.querySelectorAll('.row-delete').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const item = notRelevant.find(x => x._id === id);
        if (!item) return;
        if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
        try {
          await api.remove(id);
          notRelevant = notRelevant.filter(x => x._id !== id);
          renderTabs();
          renderNotRelevantPanel(container);
        } catch (err){
          alert('Could not delete: ' + err.message);
        }
      });
    });
  }

  function renderNotIncludedPanel(container){
    container.innerHTML = `
      <div class="info-banner">These properties are on Ben's master property list but could not be found in Yardi.</div>
      <div class="period-actions" style="margin-bottom:12px">
        <button class="ghost-btn" id="addNotIncludedBtn">+ Add</button>
      </div>
      <div class="add-period-panel" id="addNotIncludedPanel" style="display:${addNotIncludedOpen?'flex':'none'}">
        <input type="text" id="niNameInput" placeholder="Property name">
        <button class="ghost-btn" id="saveNotIncludedBtn">Add</button>
        <button class="ghost-btn" id="cancelNotIncludedBtn">Cancel</button>
        <div class="panel-error" id="addNotIncludedError"></div>
      </div>
      <div class="simplelist" id="niList"></div>
    `;
    const list = document.getElementById('niList');
    const q = searchTerm.trim().toLowerCase();
    const rows = notIncluded.filter(p => !q || p.name.toLowerCase().includes(q));
    list.innerHTML = rows.length ? rows.map(p => `
      <div class="row">
        <div class="row-main"><span>${p.name}</span></div>
        <button class="row-delete" data-id="${p._id}" title="Delete">×</button>
      </div>
    `).join('') : `<div class="empty">No matches.</div>`;

    document.getElementById('addNotIncludedBtn').addEventListener('click', ()=>{
      addNotIncludedOpen = !addNotIncludedOpen;
      renderNotIncludedPanel(container);
    });
    const cancelBtn = document.getElementById('cancelNotIncludedBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', ()=>{
      addNotIncludedOpen = false;
      renderNotIncludedPanel(container);
    });
    const saveBtn = document.getElementById('saveNotIncludedBtn');
    if (saveBtn) saveBtn.addEventListener('click', async ()=>{
      const errorBox = document.getElementById('addNotIncludedError');
      errorBox.textContent = '';
      const name = document.getElementById('niNameInput').value.trim();
      if (!name){ errorBox.textContent = 'Enter a property name.'; return; }
      saveBtn.disabled = true;
      try {
        const created = await api.create({ category: 'not_included', name });
        notIncluded.push({ _id: String(created.id), name: created.name });
        addNotIncludedOpen = false;
        renderTabs();
        renderNotIncludedPanel(container);
      } catch (err){
        errorBox.textContent = 'Could not add: ' + err.message;
        saveBtn.disabled = false;
      }
    });
    list.querySelectorAll('.row-delete').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const item = notIncluded.find(x => x._id === id);
        if (!item) return;
        if (!confirm(`Delete "${item.name}"? This cannot be undone.`)) return;
        try {
          await api.remove(id);
          notIncluded = notIncluded.filter(x => x._id !== id);
          renderTabs();
          renderNotIncludedPanel(container);
        } catch (err){
          alert('Could not delete: ' + err.message);
        }
      });
    });
  }

  // ---------- Compare panel ----------
  let compareA = null, compareB = null, compareSearch = '', compareSortCol = 'delta', compareSortDir = -1;

  function buildComparison(labelA, labelB){
    const arrA = periods[labelA].basis;
    const arrB = periods[labelB].basis;
    const mapB = new Map(arrB.map(x => [x.name.trim().toLowerCase(), x]));
    const seen = new Set();
    const rows = [];
    arrA.forEach(a => {
      const key = a.name.trim().toLowerCase();
      const b = mapB.get(key);
      seen.add(key);
      const basisA = a.basis, basisB = b ? b.basis : null;
      const delta = (basisB != null && basisA != null) ? (basisB - basisA) : null;
      const deltaPct = (delta != null && basisA) ? (delta / Math.abs(basisA)) * 100 : null;
      rows.push({ name: a.name, basisA, basisB, delta, deltaPct, status: b ? 'common' : 'onlyA' });
    });
    arrB.forEach(b => {
      const key = b.name.trim().toLowerCase();
      if (!seen.has(key)) rows.push({ name: b.name, basisA: null, basisB: b.basis, delta: null, deltaPct: null, status: 'onlyB' });
    });
    return rows;
  }

  function renderComparePanel(container){
    if (periodOrder.length < 2){
      container.innerHTML = `<div class="empty">Upload a second period from the Basis Calculation tab to enable comparison.</div>`;
      return;
    }
    if (!compareA || !periods[compareA]) compareA = periodOrder[0];
    if (!compareB || !periods[compareB] || compareB === compareA) compareB = periodOrder.find(o => o !== compareA) || periodOrder[0];

    container.innerHTML = `
      <div class="compare-controls">
        <select id="compareASelect">${periodOrder.map(l=>`<option value="${l}" ${l===compareA?'selected':''}>${l}</option>`).join('')}</select>
        <span class="compare-vs">vs</span>
        <select id="compareBSelect">${periodOrder.map(l=>`<option value="${l}" ${l===compareB?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="controls">
        <div class="search"><input type="text" id="compareSearchInput" placeholder="Search properties…" value="${compareSearch.replace(/"/g,'&quot;')}"></div>
        <div class="sort-hint">Click a column to sort</div>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th data-col="name" class="${compareSortCol==='name'?'sorted':''}">Property${compareArrow('name')}</th>
              <th data-col="basisA" class="num-col ${compareSortCol==='basisA'?'sorted':''}">Basis (${compareA})${compareArrow('basisA')}</th>
              <th data-col="basisB" class="num-col ${compareSortCol==='basisB'?'sorted':''}">Basis (${compareB})${compareArrow('basisB')}</th>
              <th data-col="delta" class="num-col ${compareSortCol==='delta'?'sorted':''}">Change ($)${compareArrow('delta')}</th>
              <th data-col="deltaPct" class="num-col ${compareSortCol==='deltaPct'?'sorted':''}">Change (%)${compareArrow('deltaPct')}</th>
            </tr>
          </thead>
          <tbody id="compareBody"></tbody>
        </table>
      </div>
    `;

    function compareArrow(col){
      if (compareSortCol !== col) return '';
      return `<span class="arrow">${compareSortDir===1?'▲':'▼'}</span>`;
    }

    let rows = buildComparison(compareA, compareB);
    if (compareSearch.trim()){
      const q = compareSearch.trim().toLowerCase();
      rows = rows.filter(r => r.name.toLowerCase().includes(q));
    }
    rows.sort((a,b) => {
      let av = a[compareSortCol], bv = b[compareSortCol];
      if (compareSortCol === 'name') return compareSortDir * av.localeCompare(bv);
      av = (typeof av === 'number') ? av : -Infinity;
      bv = (typeof bv === 'number') ? bv : -Infinity;
      return compareSortDir * (av - bv);
    });

    const tbody = document.getElementById('compareBody');
    if (rows.length === 0){
      tbody.innerHTML = `<tr><td colspan="5" class="empty">No properties match this search.</td></tr>`;
    } else {
      tbody.innerHTML = rows.map(r => {
        const deltaClass = r.delta == null ? '' : (r.delta > 0 ? 'delta-pos' : (r.delta < 0 ? 'delta-neg' : ''));
        let statusTag = '';
        if (r.status === 'onlyA') statusTag = `<span class="status-tag">Not in ${compareB}</span>`;
        if (r.status === 'onlyB') statusTag = `<span class="status-tag">Not in ${compareA}</span>`;
        return `
        <tr>
          <td class="name-cell">${r.name}${statusTag}</td>
          <td class="num-col">${r.basisA!=null?fmt(r.basisA):'<span class="dash">—</span>'}</td>
          <td class="num-col">${r.basisB!=null?fmt(r.basisB):'<span class="dash">—</span>'}</td>
          <td class="num-col ${deltaClass}">${r.delta!=null?fmt(r.delta):'<span class="dash">—</span>'}</td>
          <td class="num-col ${deltaClass}">${r.deltaPct!=null?fmtPct(r.deltaPct):'<span class="dash">—</span>'}</td>
        </tr>
        `;
      }).join('');
    }

    document.getElementById('compareASelect').addEventListener('change', (e)=>{ compareA = e.target.value; renderComparePanel(container); });
    document.getElementById('compareBSelect').addEventListener('change', (e)=>{ compareB = e.target.value; renderComparePanel(container); });
    document.getElementById('compareSearchInput').addEventListener('input', (e)=>{
      compareSearch = e.target.value;
      renderComparePanel(container);
      const inp = document.getElementById('compareSearchInput');
      inp.focus();
      inp.setSelectionRange(compareSearch.length, compareSearch.length);
    });
    document.querySelectorAll('thead th[data-col]').forEach(th=>{
      th.addEventListener('click', ()=>{
        const col = th.dataset.col;
        if (compareSortCol === col){ compareSortDir *= -1; } else { compareSortCol = col; compareSortDir = 1; }
        renderComparePanel(container);
      });
    });
  }

  // ---------- Stats ----------
  function renderStats(){
    const basis = enrichedBasis();
    const totalBasis = basis.reduce((s,p) => s + (typeof p.basis === 'number' ? p.basis : 0), 0);
    const landOnlyCount = basis.filter(p => p._markType === 'land').length;
    const buildingOnlyCount = basis.filter(p => p._markType === 'building').length;
    const reviewCount = basis.filter(p => p._markType === 'review').length;

    document.getElementById('statStrip').innerHTML = `
      <div class="stat">
        <span class="num">${basis.length}</span>
        <span class="lbl">Properties Recorded</span>
      </div>
      <div class="stat">
        <span class="num">${fmt(totalBasis)}</span>
        <span class="lbl">Total Basis</span>
      </div>
      <div class="stat">
        <span class="num">${landOnlyCount}</span>
        <span class="lbl">Land-Only Parcels</span>
      </div>
      <div class="stat building">
        <span class="num">${buildingOnlyCount}</span>
        <span class="lbl">Building-Only Parcels</span>
      </div>
      <div class="stat flagged">
        <span class="num">${reviewCount}</span>
        <span class="lbl">Flagged for Review</span>
      </div>
    `;
    document.getElementById('asOfLabel').textContent = currentPeriod;
    document.getElementById('footRight').textContent =
      `${notRelevant.length} not relevant · ${notIncluded.length} not yet in Yardi · viewing ${currentPeriod}`;
  }

  // ---------- Panel router ----------
  function renderPanel(){
    const area = document.getElementById('panelArea');
    renderStats();
    if (activeTab === 'basis'){
      renderBasisPanel(area);
    } else if (activeTab === 'notrelevant'){
      area.innerHTML = `<div class="controls"><div class="search"><input type="text" id="searchInput2" placeholder="Search…" value="${searchTerm.replace(/"/g,'&quot;')}"></div></div><div id="subpanel"></div>`;
      renderNotRelevantPanel(document.getElementById('subpanel'));
      document.getElementById('searchInput2').addEventListener('input', (e)=>{
        searchTerm = e.target.value;
        renderNotRelevantPanel(document.getElementById('subpanel'));
      });
    } else if (activeTab === 'notincluded'){
      area.innerHTML = `<div class="controls"><div class="search"><input type="text" id="searchInput3" placeholder="Search…" value="${searchTerm.replace(/"/g,'&quot;')}"></div></div><div id="subpanel"></div>`;
      renderNotIncludedPanel(document.getElementById('subpanel'));
      document.getElementById('searchInput3').addEventListener('input', (e)=>{
        searchTerm = e.target.value;
        renderNotIncludedPanel(document.getElementById('subpanel'));
      });
    } else if (activeTab === 'compare'){
      renderComparePanel(area);
    }
  }

  // ---------- Boot ----------
  function renderLoading(){
    document.getElementById('panelArea').innerHTML = `<div class="empty">Loading property records…</div>`;
  }

  function renderLoadError(message, retry){
    document.getElementById('panelArea').innerHTML = `
      <div class="add-period-panel" style="display:flex">
        <div class="panel-error" style="margin-bottom:0">Could not load property records: ${message}</div>
        <button class="ghost-btn" id="retryLoadBtn">Retry</button>
      </div>
    `;
    document.getElementById('retryLoadBtn').addEventListener('click', retry);
  }

  async function boot(){
    renderLoading();
    try {
      const data = await api.list();
      periods = {};
      periodOrder = [];
      makePeriod(LIVE_PERIOD, data.basis, { persisted: true });
      currentPeriod = LIVE_PERIOD;
      notRelevant = data.not_relevant.map(r => ({ _id: String(r.id), name: r.name, extra: r.extra || '' }));
      notIncluded = data.not_included.map(r => ({ _id: String(r.id), name: r.name }));
      // Name -> address fallback, so addresses still show up for any
      // CSV-loaded comparison period whose property names match the database
      // (matching the old behavior of the global ADDRESS_LOOKUP table).
      addressByName = {};
      [...data.basis, ...data.not_relevant, ...data.not_included].forEach(r => {
        if (r.address) addressByName[r.name] = r.address;
      });
      renderTabs();
      renderPanel();
    } catch (err){
      renderLoadError(err.message, boot);
    }
  }

  boot();

})();
</script>
